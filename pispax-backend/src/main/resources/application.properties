spring.application.name=pispax-backend

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pispax_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del servidor
server.port=8080

# JWT
jwt.secret=pispax_jwt_secret_key_2026_muy_larga_para_seguridad_hmac_sha256
jwt.expiration=86400000

# Logging
logging.level.com.pixpax=DEBUG
logging.level.org.springframework.security=INFO

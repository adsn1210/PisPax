spring.application.name=pispax-backend
spring.profiles.active=local

# Base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pispax?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Ejecutar data.sql contra BD no embebida (MySQL) y despues de que Hibernate cree las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Puerto del servidor
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Logging
logging.level.com.pixpax=INFO
logging.level.org.springframework.security=WARN

# Simulacion de viaje (milisegundos entre cada cambio de estado)
simulacion.delay.aceptado=4000
simulacion.delay.salida-recogida=5000
simulacion.delay.llegada-recogida=4000
simulacion.delay.mercancia-recogida=5000
simulacion.delay.salida-entrega=6000
simulacion.delay.llegada-entrega=4000
simulacion.delay.completado=3000
